# This workflow will run tests using node and then publish a package to the npm registry when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v7
      -
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
            version: 10
            run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
            echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
            path: ${{ env.STORE_PATH }}
            key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
            restore-keys: |
              ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install
      # Lints this package with ESLint 8 via the eslintrc entry points, then again with ESLint 10
      # via the flat-config entry points. Both formats have to keep working: ~80 plugin repos are
      # still on `.eslintrc.cjs` while newer ones are on `eslint.config.js`.
      - run: npm run test


  publish-npm:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    # OIDC trusted publishing: npm exchanges the GitHub-issued `id-token` for a
    # short-lived publish credential at the registry, so there is no stored
    # NPM_TOKEN to expire, rotate or leak. `contents: write` is needed for the
    # auto-bump commit + tag push below.
    #
    # One-time setup on https://www.npmjs.com/package/eslint-config-etherpad/access:
    #   Trusted Publishers -> Add -> Provider: GitHub Actions
    #   Org: ether,  Repo: eslint-config-etherpad,  Workflow filename: npmpublish.yml
    #   Environment: (blank),  Allowed actions: permit `npm publish`
    permissions:
      contents: write
      id-token: write
    steps:
      -
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      -
        name: Bump version (patch)
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0) || exit 1
          NEW_COMMITS=$(git rev-list --count "${LATEST_TAG}"..) || exit 1
          [ "${NEW_COMMITS}" -gt 0 ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Use --frozen-lockfile so the install can't modify pnpm-lock.yaml
          # during publish. A dirty tree makes `pnpm version patch` abort with
          # "Git working directory not clean". If the lockfile is genuinely
          # out of sync, the earlier `test` job (which runs `pnpm install`
          # without --frozen-lockfile) will have flagged it on the PR.
          pnpm i --frozen-lockfile
          pnpm version patch
          git push --follow-tags
      # This is required if the package has a prepare script that uses something
      # in dependencies or devDependencies.
      -
        run: pnpm i
      # `pnpm publish` must come after `git push` otherwise there is a race
      # condition: If two PRs are merged back-to-back then master/main will be
      # updated with the commits from the second PR before the first PR's
      # workflow has a chance to push the commit generated by `npm version
      # patch`. This causes the first PR's `git push` step to fail after the
      # package has already been published, which in turn will cause all future
      # workflow runs to fail because they will all attempt to use the same
      # already-used version number. By running `pnpm publish` after `git push`,
      # back-to-back merges will cause the first merge's workflow to fail but
      # the second's will succeed.
      # pnpm 10.4+ discovers the GitHub OIDC token itself (granted by
      # `id-token: write` above) and exchanges it with the registry, so no
      # secret is involved. `--provenance` attaches the signed-by-GitHub
      # attestation that npm shows on the package page.
      #
      # The `npm access grant` step that used to follow is gone: it was
      # idempotent, and an OIDC credential is not authorised for it anyway.
      -
        run: pnpm publish --no-git-checks --provenance
